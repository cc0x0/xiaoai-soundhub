services:
  soundhub-server:
    build: .
    container_name: xiaoai-soundhub
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8989}:8080" # 外部访问端口 (优先读取 .env 中的 SERVER_PORT，默认 8989)
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      # 账号与网络参数自动从 .env 文件读取
      - XIAOI_USER_ID=${XIAOI_USER_ID:-你的小米ID}
      - XIAOI_PASS_TOKEN=${XIAOI_PASS_TOKEN:-你的passToken}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-}
      - XIAOI_DEFAULT_DID=${XIAOI_DEFAULT_DID:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://你的云服务器IP:8989}
      - ACTIVE_SOURCE=${ACTIVE_SOURCE:-my-custom-source.js}
      - ENABLE_LISTENER=${ENABLE_LISTENER:-true}
    volumes:
      - ./sources:/app/sources
      - ./data:/root/.xiaoai-soundhub

